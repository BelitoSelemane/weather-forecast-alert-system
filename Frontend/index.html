<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast & Alert System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>🌦️ Weather Forecast & Alert System</h1>
    </header>

    <main class="container">

        <!-- Barra de pesquisa -->
        <section class="search-section">
            <input type="text" id="cityInput" placeholder="Digite o nome da cidade...">
            <button id="searchBtn">Search</button>
        </section>

        <!-- Card com o clima atual -->
        <section class="weather-card" id="weatherCard">
            <h2 id="cityName">name of City</h2>
            <p id="temperature">-- °C</p>
            <p id="description">Time Condiction</p>
            <p id="humidity">umidy: -- %</p>
            <p id="wind">wind: -- km/h</p>
        </section>

        <!-- Área de alertas -->
        <section class="alert-box" id="alertBox">
            <!-- Alertas aparecem aqui via JavaScript -->
        </section>

        <!-- Previsão dos próximos dias -->
        <section class="forecast-section" id="forecastSection">
            <!-- Cards de previsão futura vão aparecer aqui -->
        </section>

    </main>

    <footer class="app-footer">
        <p>Weather Forecast & Alert System —  SkillDzire Intership project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
